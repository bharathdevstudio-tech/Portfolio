<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070714" />
    <title>Page not found — Bharath DevStudio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #070714;
        color: #c3c8e0;
        font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
      }
      .wrap {
        max-width: 34rem;
      }
      .code {
        margin: 0;
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(120deg, #7c3aed, #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.5rem;
        color: #f2f4ff;
      }
      p {
        margin: 0 0 1.75rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: linear-gradient(120deg, #7c3aed, #6d28d9);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        filter: brightness(1.12);
      }
      a:focus-visible {
        outline: 2px solid #06b6d4;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or may have moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
